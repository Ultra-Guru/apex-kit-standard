name: CI

# apex-kit-standard CI —— 两道防线：
#   1. build-test：库自身编译 + 单测 + publishToMavenLocal 可发布性
#   2. consumer-check：跨仓库验证宿主 Android-Guru-Agent 仍能编译（防下游崩，
#      跨仓库 CI 漂移的解法）—— 库的每次 PR 都对宿主 :app:compileDebugKotlin
#      跑一遍，坏下游立刻看到。
#
# 宿主消费方式（迁移期 composite build）：宿主 settings.gradle.kts 里有
# 条件 includeBuild —— 当兄弟目录 ../Android-Guru-Agent 存在时接入并按坐标
# com.apex.standardkit:standard-loop 自动替换。本 workflow 把两个仓库 checkout 成
# 兄弟布局，正好命中该条件。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (standard-loop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build module (compile only first for fast feedback)
        run: ./gradlew :standard-loop:assemble --no-daemon --stacktrace

      # 纯 JVM 测试必须独立跑（standard-loop 零 Android 依赖的可执行证明）
      - name: standard-loop pure-JVM tests
        run: ./gradlew :standard-loop:test --no-daemon

      # 可发布性验证：坐标/POM 生成必须完整
      - name: publishToMavenLocal smoke check
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          VER=$(grep -m1 '^version = "' standard-loop/build.gradle.kts | sed 's/version = "//;s/"//')
          echo "smoke-checking com.apex.standardkit:standard-loop:$VER"
          if ls ~/.m2/repository/com/apex/standardkit/standard-loop/$VER/standard-loop-$VER.{module,pom} >/dev/null 2>&1; then
            echo "✅ com.apex.standardkit:standard-loop:$VER published to mavenLocal"
          else
            echo "❌ com.apex.standardkit:standard-loop:$VER missing in mavenLocal"; exit 1
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: standard-loop/build/reports/tests/
          retention-days: 7

  consumer-check:
    name: Consumer Check (host Android-Guru-Agent)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (sibling layout)
        uses: actions/checkout@v7
        with:
          path: apex-kit-standard

      - name: Checkout host repo (sibling layout)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/Android-Guru-Agent
          ref: main
          path: Android-Guru-Agent

      - name: Read host browser-kit pin
        id: bkitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-browser-kit (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-browser-kit
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-browser-kit

      # ── 兄弟库补齐检出（宿主多库 composite build 全量接线）──────────────
      # 宿主 81db0d48（PR #388）起 :app 同时依赖 com.apex.workspace:{core,explorer}
      # 且坐标无远端仓库可解析 —— 缺嵌套检出则 :app:compileDebugKotlin 直接
      # 解析失败。按宿主 workspace-kit.lock 钉住（缺锁回退 main），与宿主
      # 自身 CI 的 pinned checkout 同源；被测库 = 本仓库 symlink，兄弟库 =
      # 宿主锁定的已知好版本。
      - name: Read host workspace-kit pin
        id: wkitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/workspace-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-workspace-kit (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-workspace-kit
          ref: ${{ steps.wkitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-workspace-kit

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > Android-Guru-Agent/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 宿主 settings.gradle.kts 的嵌套兜底分支命中——composite build 把
      # com.apex.standardkit:standard-loop 替换为本仓库检出。
      # 改名过渡布局（apex-*(x)-kit → apex-kit-*）：新名检出 + 旧名兄弟/嵌套
      # 双别名，任一时刻宿主新旧探针恒命中（宿主侧联动 PR 合并前后均绿）。
      # 兄弟库 = 宿主锁定的已知好版本（嵌套检出旧名 + 新名别名，同过渡语义）。
      - name: Link kit into host nested fallback path
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          # 本库：新名检出（apex-kit-standard）+ 旧名兄弟别名（宿主 ../apex-standard-kit 探针）
          ln -s "$WS/apex-kit-standard" "$WS/apex-standard-kit"
          # 嵌套兜底：新旧双名别名（宿主嵌套探针，改名前后均命中）
          ln -s "$WS/apex-kit-standard" "$WS/Android-Guru-Agent/apex-standard-kit"
          ln -s "$WS/apex-kit-standard" "$WS/Android-Guru-Agent/apex-kit-standard"
          ls -la "$WS/Android-Guru-Agent/" | grep -E "apex-(kit-)?(standard)"
          # 兄弟库新名别名（嵌套探针，宿主联动 PR 合并后命中；旧名仍为真目录）
          ln -s "$WS/Android-Guru-Agent/apex-browser-kit" "$WS/Android-Guru-Agent/apex-kit-browser"
          ln -s "$WS/Android-Guru-Agent/apex-workspace-kit" "$WS/Android-Guru-Agent/apex-kit-workspace"
          # 接线校验：新旧任一形态在即算接通（缺一即解析失败）
          for kit in apex-browser-kit:apex-kit-browser \
                     apex-standard-kit:apex-kit-standard \
                     apex-workspace-kit:apex-kit-workspace; do
            OLD="${kit%%:*}"; NEW="${kit##*:}"
            grep -qE "$OLD|$NEW" Android-Guru-Agent/settings.gradle.kts || {
              echo "::error::宿主 settings.gradle.kts 缺少 $OLD / $NEW 接线"; exit 1; }
          done
          echo "✅ 宿主三 kit 条件 includeBuild 接线齐全（browser/standard/workspace，新旧名任一形态）"

      - name: Compile host app module (Kotlin only, no APK packaging)
        working-directory: Android-Guru-Agent
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace -x lint

      - name: Host core module tests (kit consumer surface)
        working-directory: Android-Guru-Agent
        run: ./gradlew :core:code-engine:test --no-daemon
